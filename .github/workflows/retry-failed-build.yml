name: Retry failed build

on:
  workflow_run:
    workflows: ["Build OrangeFox Recovery"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs on a fresh runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs"
          echo "Requested rerun of attempt ${{ github.event.workflow_run.run_attempt }} (max 3)"
